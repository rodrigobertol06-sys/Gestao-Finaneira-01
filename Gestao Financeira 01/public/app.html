<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão Financeira</title>
  <meta name="theme-color" content="#140B3D" />
  <!-- 000 - Aplica o tema salvo ANTES do CSS carregar, evitando um flash da cor errada -->
  <script>
    if (localStorage.getItem("tema") === "dark") document.documentElement.classList.add("dark");
  </script>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/output.css" />
</head>
<body class="min-h-screen bg-page dark:bg-page-dark">

  <!-- 001 - Navbar fixa no topo (menu mobile, recolher menu, marca/início e ações do usuário) -->
  <header id="navbar" class="bg-primary fixed top-0 left-0 right-0 h-14 z-30"></header>

  <!-- 002 - Overlay escuro exibido atrás do menu lateral no mobile -->
  <div id="overlay-menu" class="hidden fixed inset-0 bg-black/40 z-20 lg:hidden"></div>

  <!-- 003 - Menu lateral: tom mais claro que a navbar (mais leve visualmente), drawer no mobile,
       fixo e recolhível em telas grandes -->
  <aside
    id="sidebar"
    class="fixed top-14 left-0 bottom-0 w-64 bg-sidebar shadow-lg -translate-x-full transition-all duration-200 z-30 lg:translate-x-0 lg:shadow-none lg:border-r lg:border-white/10"
  >
    <nav id="sidebar-links" class="p-3 space-y-1"></nav>
  </aside>

  <!-- 004 - Área de conteúdo: recebe o deslocamento de navbar/sidebar; o router alterna a barra "Voltar" -->
  <div id="area-conteudo" class="pt-14 lg:pl-64 min-h-screen transition-all duration-200">
    <!-- 004.1 - Barra "Voltar", oculta na tela inicial (Dashboard) e exibida nas demais páginas -->
    <div id="barra-voltar" class="hidden px-4 sm:px-6 pt-3">
      <button id="botao-voltar" class="inline-flex items-center gap-1 text-sm text-primary dark:text-white hover:text-primary-light dark:hover:text-white/70">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Voltar
      </button>
    </div>
    <main id="conteudo-principal"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
